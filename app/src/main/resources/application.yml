spring:
  application:
    name: dropoff
  datasource:
    # Defaults match compose.yaml for local development; containers override them with DB_URL, DB_USERNAME and DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dropoff}
    username: ${DB_USERNAME:dropoff}
    password: ${DB_PASSWORD:dropoff}
  jpa:
    # Flyway owns the schema; Hibernate only checks entities match it (ADR-0002).
    hibernate:
      ddl-auto: validate
    open-in-view: false
  modulith:
    events:
      # Outbox settings (ticket #42, ADR-0006): delete completed publications, retry outstanding ones on restart,
      # and let Flyway (V6) own the event_publication table.
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
