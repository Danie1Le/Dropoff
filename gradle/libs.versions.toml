[versions]
# Build tooling (ticket #7: coding standards)
spotless = "8.11.0"
palantir-java-format = "2.103.0"
errorprone-gradle = "5.2.0"
errorprone = "2.52.0"
nullaway = "0.14.3"
jspecify = "1.0.1"

[libraries]
# Plugins used by build-logic, declared as libraries so the convention plugin can apply them
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle" }

# Compile-time tools
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
