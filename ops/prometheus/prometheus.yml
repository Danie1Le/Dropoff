# Prometheus scrape config (M6-1, ticket #34). Every service exposes /actuator/prometheus; Prometheus pulls it every
# 15 s, the same interval the services cache their gauge queries for.
#
# Since M6-3 the services run in Compose, so Prometheus reaches them by service name on the Compose network. A service
# started with bootRun on the host is not scraped. The `service` label names each one for the M6-2 dashboard.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dropoff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["merchant:8081"]
        labels:
          service: merchant-service
      - targets: ["order:8082"]
        labels:
          service: order-service
      - targets: ["dispatch:8083"]
        labels:
          service: dispatch-service
