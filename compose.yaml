# Local infrastructure, plus the three services as containers (ticket #6 picks the images, M6-3 adds the services).
# A plain `docker compose up -d` starts only the infrastructure (Postgres, Redis, Kafka, Prometheus 9090, Grafana 3000),
# so the services can run from source with `./gradlew :services:<name>:bootRun`. To run them as containers, build the
# jars, then pick a profile:
#   ./gradlew :services:merchant:bootJar :services:order:bootJar :services:dispatch:bootJar :tools:simulator:installDist
#   docker compose --profile services up -d --build   # plus merchant 8081, order 8082, dispatch 8083
#   docker compose --profile demo up -d --build       # the same, plus the simulator: seeds once, then runs the bots
#   docker compose --profile demo down -v             # stop everything, and drop the data and the simulator's state
# Each service logs in as its own user to its own database (ADR-0007). Prometheus scrapes all three by service name
# (M6-1); Grafana charts them (M6-2). Their targets show as down while only the infrastructure runs.
#
# Memory: each service is capped at 512 MB with a 256 MB heap; the rest is metaspace, threads and Kafka/Netty buffers.
# If a container exits with code 137 (OOM-killed), raise mem_limit in x-service first (768m), and the heap only if the
# logs show an OutOfMemoryError: Java heap space. Keep -Xmx at about half of mem_limit.

# Shared by merchant, order and dispatch (YAML merge keys). A service that sets environment or depends_on merges these
# in with `<<:`, since a merge does not reach into nested maps.
x-service: &service
  profiles: [services, demo]
  mem_limit: 512m
  environment: &service-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    JAVA_TOOL_OPTIONS: -Xmx256m
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    # Keep in sync with TestcontainersConfiguration (integration tests use the same image).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: dropoff
      POSTGRES_USER: dropoff
      POSTGRES_PASSWORD: dropoff
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # Creates dispatch_db, merchant_db and order_db with one user each (M5-4, ADR-0007). It runs only on an empty
      # volume: after a change, `docker compose down -v` and reseed.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropoff -d dropoff"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Keep in sync with TestcontainersConfiguration (integration tests use the same image and settings).
    # One KRaft broker, no ZooKeeper (ticket #32). The app declares every topic; the broker never creates one.
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is for the app on your machine; PLAINTEXT is for containers on the Compose network (and the replay script).
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    # Scrapes /actuator/prometheus on every service every 15 s (M6-1, ticket #34). UI at http://localhost:9090.
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # The three services (M6-3, ticket #114), in profiles `services` and `demo`. Each image is built from the shared
  # ops/docker/service.Dockerfile and the jar the host built, and is named the way M6-4 publishes it. Ports stay on
  # 127.0.0.1, so the smoke script and curl work as with bootRun. The healthcheck is in the Dockerfile.
  merchant:
    <<: *service
    image: ghcr.io/danie1le/dropoff-merchant:${DROPOFF_TAG:-local}
    build:
      context: services/merchant
      dockerfile: ../../ops/docker/service.Dockerfile
      args: {JAR: merchant.jar, PORT: 8081}
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/merchant_db

  order:
    <<: *service
    image: ghcr.io/danie1le/dropoff-order:${DROPOFF_TAG:-local}
    build:
      context: services/order
      dockerfile: ../../ops/docker/service.Dockerfile
      args: {JAR: order.jar, PORT: 8082}
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db

  dispatch:
    <<: *service
    image: ghcr.io/danie1le/dropoff-dispatch:${DROPOFF_TAG:-local}
    build:
      context: services/dispatch
      dockerfile: ../../ops/docker/service.Dockerfile
      args: {JAR: dispatch.jar, PORT: 8083}
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/dispatch_db
      REDIS_HOST: redis
    depends_on:
      <<: *service-deps
      redis:
        condition: service_healthy

  # Profile demo only (M6-3): seeds through the services if /data/state.json is missing, then runs the customer,
  # merchant and courier bots until stopped. `docker compose down -v` drops the volume with the databases, so the next
  # demo seeds again. `docker compose --profile demo run --rm simulator smoke` runs the full-flow check instead. Smoke
  # keeps its own state in /data/smoke-state.json, so it seeds and drives its own merchants and couriers instead of
  # racing the demo's bots for theirs.
  simulator:
    image: ghcr.io/danie1le/dropoff-simulator:${DROPOFF_TAG:-local}
    build: tools/simulator
    profiles: [demo]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx128m
    mem_limit: 256m
    volumes:
      - simulator-data:/data
    depends_on:
      merchant:
        condition: service_healthy
      order:
        condition: service_healthy
      dispatch:
        condition: service_healthy

  grafana:
    # Dashboard, datasource and alert rules come from ops/grafana/provisioning (M6-2, ticket #34). UI at
    # http://localhost:3000, no login needed (read-only viewer); sign in as admin/admin to edit. Alerts show in the UI only.
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dropoff-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  simulator-data:
