# Local infrastructure and the three services as containers (ticket #6 picks the images, M6-3 adds the services).
# Build the jars, then start everything:
#   ./gradlew :services:merchant:bootJar :services:order:bootJar :services:dispatch:bootJar :tools:simulator:installDist
#   docker compose up -d --build                  # merchant 8081, order 8082, dispatch 8083, Prometheus 9090, Grafana 3000
#   docker compose --profile demo up -d --build   # the same, plus the simulator: seeds once, then runs the bots
# Each service logs in as its own user to its own database (ADR-0007). Prometheus scrapes all three by service name
# (M6-1); Grafana charts them (M6-2).
# To run a service from source instead, start only the infrastructure, then `./gradlew :services:<name>:bootRun`:
#   docker compose up -d postgres redis kafka prometheus grafana
# The services are capped at 512 MB each (heap 256 MB) to fit small machines.
services:
  postgres:
    # Keep in sync with TestcontainersConfiguration (integration tests use the same image).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: dropoff
      POSTGRES_USER: dropoff
      POSTGRES_PASSWORD: dropoff
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # Creates dispatch_db, merchant_db and order_db with one user each (M5-4, ADR-0007). It runs only on an empty
      # volume: after a change, `docker compose down -v` and reseed.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropoff -d dropoff"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Keep in sync with TestcontainersConfiguration (integration tests use the same image and settings).
    # One KRaft broker, no ZooKeeper (ticket #32). The app declares every topic; the broker never creates one.
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is for the app on your machine; PLAINTEXT is for containers on the Compose network (and the replay script).
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    # Scrapes /actuator/prometheus on every service every 15 s (M6-1, ticket #34). UI at http://localhost:9090.
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # The three services (M6-3, ticket #114). Each image is built from its Dockerfile and the jar the host built, and is
  # named the way M6-4 publishes it. Ports stay on 127.0.0.1, so the smoke script and curl work as with bootRun.
  merchant:
    image: ghcr.io/danie1le/dropoff-merchant:${DROPOFF_TAG:-local}
    build: services/merchant
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/merchant_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # Busybox wget ships with the Alpine base image. The other two services repeat this with their own port.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

  order:
    image: ghcr.io/danie1le/dropoff-order:${DROPOFF_TAG:-local}
    build: services/order
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

  dispatch:
    image: ghcr.io/danie1le/dropoff-dispatch:${DROPOFF_TAG:-local}
    build: services/dispatch
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dispatch_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

  # Profile demo only (M6-3): seeds through the services if its volume has no state file, then runs the customer,
  # merchant and courier bots until stopped. `docker compose down -v` drops the state with the databases, so the next
  # demo seeds again. `docker compose --profile demo run --rm simulator smoke` runs the full-flow check instead.
  simulator:
    image: ghcr.io/danie1le/dropoff-simulator:${DROPOFF_TAG:-local}
    build: tools/simulator
    profiles: [demo]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx128m
    mem_limit: 256m
    volumes:
      - simulator-data:/data
    depends_on:
      merchant:
        condition: service_healthy
      order:
        condition: service_healthy
      dispatch:
        condition: service_healthy

  grafana:
    # Dashboard, datasource and alert rules come from ops/grafana/provisioning (M6-2, ticket #34). UI at
    # http://localhost:3000, no login needed (read-only viewer); sign in as admin/admin to edit. Alerts show in the UI only.
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dropoff-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  simulator-data:
